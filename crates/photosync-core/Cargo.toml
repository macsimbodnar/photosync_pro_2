[package]
name = "photosync-core"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1.8.7"
libc = "0.2.191"

[features]
# Test seams only (DEC-027). Turned on by the dev-dependency below, so the
# tests get it and a normal build, which never sees dev-dependencies, does not.
test-support = []

[dev-dependencies]
photosync-core = { path = ".", features = ["test-support"] }
